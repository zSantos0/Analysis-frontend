<!DOCTYPE html>
<html>
<head>
  <title>Analysis Site</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .login, .panel { max-width: 400px; margin: auto; margin-top: 20px; }
    input, button { width: 100%; padding: 8px; margin: 5px 0; }
    button { cursor: pointer; }
    #status { margin-top: 20px; font-weight: bold; }
    .analyses { margin-top: 10px; }
    .analyses div { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Analysis Site</h1>

  <div class="login">
    <h3>Login Admin</h3>
    <input type="email" id="email" placeholder="Email" value="admin@meusite.com">
    <input type="password" id="password" placeholder="Senha" value="Admin123!">
    <button onclick="login()">Entrar</button>
  </div>

  <div class="panel" id="panel" style="display:none;">
    <h3>Painel de Análises</h3>
    <button onclick="gerarAnalise('under-over')">Gerar Under/Over</button>
    <button onclick="gerarAnalise('escanteios')">Gerar Escanteios</button>
    <button onclick="gerarAnalise('cartoes')">Gerar Cartões</button>

    <div class="analyses" id="analyses"></div>
  </div>

  <div id="status">Status da API: carregando...</div>

  <script>
    const backendURL = 'https://analysisfrontend01.vercel.app/'; // Substitua pelo seu link do backend

    // Verifica se a API está online
    fetch(backendURL)
      .then(res => res.text())
      .then(data => document.getElementById('status').textContent = 'API: ' + data)
      .catch(err => document.getElementById('status').textContent = 'API: Erro');

    // Login admin
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if(email === 'admin@meusite.com' && password === 'Admin123!') {
        alert('Login bem-sucedido! Painel liberado.');
        document.getElementById('panel').style.display = 'block';
        document.getElementById('status').textContent += ' (Admin logado)';
        document.querySelector('.login').style.display = 'none';
      } else {
        alert('Email ou senha incorretos.');
      }
    }

    // Função simulada de geração de análise
    function gerarAnalise(tipo) {
      const container = document.getElementById('analyses');
      let resultado = '';

      switch(tipo) {
        case 'under-over':
          resultado = 'Análise Under/Over: Favorito agressivo → Under 3.5';
          break;
        case 'escanteios':
          resultado = 'Análise Escanteios: Over 7.5 escanteios provável';
          break;
        case 'cartoes':
          resultado = 'Análise Cartões: Jogo intenso → Mais de 3 cartões';
          break;
        default:
          resultado = 'Nenhuma análise';
      }

      const div = document.createElement('div');
      div.textContent = resultado;
      container.prepend(div);
    }
  </script>
</body>
</html>
