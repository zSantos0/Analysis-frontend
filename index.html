<!DOCTYPE html>
<html>
<head>
  <title>Analysis Site</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    h1 { text-align: center; }
    .login, .panel { max-width: 400px; margin: auto; margin-top: 20px; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);}
    input, button { width: 100%; padding: 10px; margin: 5px 0; }
    button { cursor: pointer; background: #0070f3; color: #fff; border: none; border-radius: 5px; }
    button:hover { background: #005ac1; }
    #status { margin-top: 20px; font-weight: bold; text-align: center; }
    .analyses { margin-top: 10px; }
    .analyses div { margin-bottom: 10px; padding: 8px; background: #e2e8f0; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>Analysis Site</h1>

  <div class="login">
    <h3>Login Admin</h3>
    <input type="email" id="email" placeholder="Email" value="admin@meusite.com">
    <input type="password" id="password" placeholder="Senha" value="Admin123!">
    <button onclick="login()">Entrar</button>
  </div>

  <div class="panel" id="panel" style="display:none;">
    <h3>Painel de Análises</h3>
    <button onclick="gerarAnalise('under-over')">Gerar Under/Over</button>
    <button onclick="gerarAnalise('escanteios')">Gerar Escanteios</button>
    <button onclick="gerarAnalise('cartoes')">Gerar Cartões</button>

    <div class="analyses" id="analyses"></div>
  </div>

  <div id="status">Status da API: carregando...</div>

  <script>
    const backendURL = 'https://analysisfrontend01.vercel.app/'; // Substitua pelo seu backend

    // Verifica status da API
    fetch(backendURL)
      .then(res => res.text())
      .then(data => document.getElementById('status').textContent = 'API: ' + data)
      .catch(err => document.getElementById('status').textContent = 'API: Erro');

    // Login admin
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if(email === 'admin@meusite.com' && password === 'Admin123!') {
        alert('Login bem-sucedido! Painel liberado.');
        document.getElementById('panel').style.display = 'block';
        document.getElementById('status').textContent += ' (Admin logado)';
        document.querySelector('.login').style.display = 'none';
      } else {
        alert('Email ou senha incorretos.');
      }
    }

    // Simulação de análise com lógica básica
    function gerarAnalise(tipo) {
      const container = document.getElementById('analyses');
      let resultado = '';
      const times = ['Time A', 'Time B', 'Time C', 'Time D'];
      const favorito = times[Math.floor(Math.random() * times.length)];
      const agressivo = Math.random() > 0.5; // true = agressivo, false = controlado
      const gols = Math.floor(Math.random() * 5); // 0-4
      const escanteios = Math.floor(Math.random() * 10) + 4; // 4-13
      const cartoes = Math.floor(Math.random() * 5); // 0-4

      switch(tipo) {
        case 'under-over':
          resultado = `Jogo ${times[0]} x ${times[1]} → Favorito: ${favorito} (${agressivo ? 'Agressivo' : 'Controlado'}) → ${gols > 2 ? 'Over 2.5' : 'Under 3.5'} gols`;
          break;
        case 'escanteios':
          resultado = `Jogo ${times[2]} x ${times[3]} → ${escanteios} escanteios prováveis → ${escanteios > 7 ? 'Over' : 'Under'}`;
          break;
        case 'cartoes':
          resultado = `Jogo ${times[0]} x ${times[3]} → ${cartoes} cartões esperados → ${cartoes > 2 ? 'Mais de 3 cartões' : 'Menos de 3 cartões'}`;
          break;
        default:
          resultado = 'Nenhuma análise';
      }

      const div = document.createElement('div');
      div.textContent = resultado;
      container.prepend(div);
    }
  </script>
</body>
</html>
